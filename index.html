<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#5B9EB5">
<title>一秋的工作台</title>
<link rel="icon" type="image/png" sizes="180x180" href="icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="一秋工作台">
<style>
:root{
  --celadon-deep:#3D7A8E;--celadon:#5B9EB5;--celadon-light:#8DC0CC;
  --celadon-mist:#BCD9E2;--celadon-ghost:#E3EFF3;
  --bg:#F3F6F7;--card:#FFFFFF;--text:#1E2D35;
  --text-sec:#6A7F88;--text-hint:#A0B3BA;
  --shadow:0 1px 8px rgba(61,122,142,.06),0 4px 16px rgba(61,122,142,.04);
  --radius:18px;--radius-sm:14px;
  --font:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;
  --sidebar-w:220px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}

/* Layout Toggle */
.layout-toggle{position:fixed;top:16px;right:16px;z-index:999;background:var(--card);border:1.5px solid var(--celadon-mist);border-radius:10px;padding:6px 12px;font-size:11px;font-family:var(--font);color:var(--celadon-deep);cursor:pointer;font-weight:500;box-shadow:var(--shadow)}

/* Sidebar Layout */
.sidebar-layout{display:none}.sidebar-layout.active-layout{display:flex}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--card);border-right:1px solid rgba(91,158,181,.08);padding:24px 0;position:fixed;left:0;top:0;z-index:50;display:flex;flex-direction:column}
.sidebar-brand{padding:0 20px 24px;font-size:17px;font-weight:600;color:var(--celadon-deep);letter-spacing:.3px}
.sidebar-brand small{display:block;font-size:11px;font-weight:300;color:var(--text-hint);margin-top:2px}
.sidebar-nav{flex:1}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;font-size:14px;color:var(--text-sec);border-left:3px solid transparent;transition:all .2s}
.sidebar-item.active{color:var(--celadon-deep);background:var(--celadon-ghost);border-left-color:var(--celadon);font-weight:500}
.sidebar-item:hover{background:var(--celadon-ghost)}
.si-icon{font-size:18px;width:24px;text-align:center}
.sidebar-content{margin-left:var(--sidebar-w);flex:1;padding:24px;min-height:100vh}

/* Bottom Layout */
.bottom-layout{display:none;flex-direction:column;min-height:100vh}.bottom-layout.active-layout{display:flex}
.bottom-header{padding:20px 20px 12px;text-align:center}
.header-date{font-size:12px;color:var(--text-hint);margin-bottom:4px}
.header-title{font-size:20px;font-weight:600;color:var(--celadon-deep)}
.header-quote{font-size:12px;color:var(--text-sec);margin-top:6px;font-style:italic}
.bottom-content{flex:1;padding:0 16px 100px;overflow-y:auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid rgba(91,158,181,.08);display:flex;padding:8px 0 env(safe-area-inset-bottom,8px);z-index:100}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;cursor:pointer;color:var(--text-hint);font-size:11px;border:none;background:none;font-family:var(--font)}
.bnav-item.active{color:var(--celadon-deep);font-weight:500}
.bnav-icon{font-size:22px}

/* Home Tiles */
.home-greeting{text-align:center;padding:24px 0 16px}
.home-greeting-text{font-size:22px;font-weight:600;color:var(--celadon-deep)}
.home-greeting-sub{font-size:13px;color:var(--text-hint);margin-top:4px}
.home-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{background:var(--card);border-radius:var(--radius-sm);padding:18px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile-lg{grid-column:span 2}
.tile-accent{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--celadon),var(--celadon-light))}
.tile-icon{font-size:28px;margin-bottom:8px}
.tile-title{font-size:14px;font-weight:500;color:var(--text-sec);margin-bottom:6px}
.tile-num{font-size:28px;font-weight:600;color:var(--celadon-deep)}
.tile-sub{font-size:12px;color:var(--text-hint)}

/* Todo */
.todo-input-wrap{display:flex;gap:10px;margin-bottom:20px}
.todo-input{flex:1;padding:14px 16px;border:1.5px solid var(--celadon-mist);border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);background:var(--card);color:var(--text);outline:none;resize:none;min-height:48px}
.todo-input:focus{border-color:var(--celadon)}
.todo-add-btn{padding:0 20px;background:var(--celadon);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);cursor:pointer;font-weight:500}
.todo-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;font-size:13px;color:var(--text-sec)}
.todo-stats>div{background:var(--card);padding:10px;border-radius:10px;text-align:center;box-shadow:var(--shadow)}
.todo-stats span{font-weight:600;color:var(--celadon-deep)}
.todo-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:10px;box-shadow:var(--shadow)}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-hint)}
.todo-item.fail .todo-text{color:#c0392b}
.todo-text{flex:1;font-size:14px;margin-right:12px}
.todo-btns{display:flex;gap:6px}
.todo-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--celadon-mist);background:var(--card);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.todo-btn.check{color:#2E7D32;border-color:#a5d6a7}
.todo-btn.cross{color:#c0392b;border-color:#ef9a9a}
.todo-clear-btn{width:100%;padding:12px;background:var(--celadon-ghost);border:1.5px solid var(--celadon-mist);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);color:var(--celadon-deep);cursor:pointer;font-weight:500;margin-top:8px}

/* History */
.history-section{margin-top:24px}
.history-title{font-size:15px;font-weight:600;color:var(--celadon-deep);margin-bottom:12px}
.history-week-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.history-week-stats .stat-box{background:var(--card);padding:14px 10px;border-radius:10px;text-align:center;box-shadow:var(--shadow)}
.history-week-stats .stat-num{font-size:18px;font-weight:600;color:var(--celadon-deep)}
.history-week-stats .stat-label{color:var(--text-hint);margin-top:2px}
.history-date{font-size:13px;font-weight:500;color:var(--text-sec);padding:10px 0 6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.history-date::before{content:'▸';font-size:10px;transition:transform .2s}
.history-date.open::before{transform:rotate(90deg)}
.history-detail{display:none;padding-left:16px}
.history-detail.open{display:block}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:13px}
.history-item .h-status{font-size:12px;padding:2px 8px;border-radius:6px}
.history-item .h-status.done{background:#e8f5e9;color:#2E7D32}
.history-item .h-status.fail{background:#ffebee;color:#c0392b}
.history-item .h-status.pending{background:var(--celadon-ghost);color:var(--celadon-deep)}

/* Create */
.create-tabs{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.create-tab{padding:20px;text-align:left;background:var(--card);border:1.5px solid var(--celadon-mist);border-radius:14px;font-size:16px;font-family:var(--font);color:var(--text-sec);cursor:pointer;font-weight:500;box-shadow:var(--shadow);transition:all .15s}
.create-tab:active{transform:scale(0.97);background:var(--celadon-ghost)}
.create-tab.active{background:var(--celadon);color:#fff;border-color:var(--celadon)}
.note-input{width:100%;padding:14px;border:1.5px solid var(--celadon-mist);border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);background:var(--card);color:var(--text);outline:none;resize:vertical;min-height:100px;margin-bottom:12px}
.note-input:focus{border-color:var(--celadon)}
.btn-primary{padding:10px 20px;background:var(--celadon);color:#fff;border:none;border-radius:10px;font-size:13px;font-family:var(--font);cursor:pointer;font-weight:500}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;border:1.5px solid var(--celadon-mist);background:var(--card);color:var(--celadon-deep);cursor:pointer;font-family:var(--font)}
.note-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.note-card-text{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:10px}
.note-card-btns{display:flex;gap:8px;flex-wrap:wrap}
.copy-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.copy-card-text{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:10px}
.copy-card-btns{display:flex;gap:8px;flex-wrap:wrap}
.proj-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.proj-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.proj-title{font-size:15px;font-weight:500}
.proj-status{font-size:12px;padding:3px 10px;border-radius:8px}
.proj-status.planning{background:#FFF3E0;color:#E65100}
.proj-status.active{background:#E3F2FD;color:#1565C0}
.proj-status.done{background:#E8F5E9;color:#2E7D32}

/* Growth */
.growth-section{margin-bottom:24px}
.growth-title{font-size:15px;font-weight:600;color:var(--celadon-deep);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.book-item{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.book-title{font-size:14px;font-weight:500;margin-bottom:8px}
.book-progress-bar{height:8px;background:var(--celadon-ghost);border-radius:4px;overflow:hidden;margin-bottom:8px}
.book-progress-fill{height:100%;background:linear-gradient(90deg,var(--celadon),var(--celadon-light));border-radius:4px;transition:width .3s}
.book-edit-row{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text-sec)}
.book-edit-row input{width:60px;padding:6px 8px;border:1.5px solid var(--celadon-mist);border-radius:8px;font-size:13px;font-family:var(--font);text-align:center}
.fitness-log-input{display:flex;gap:10px;margin-bottom:16px}
.fitness-log-input input{flex:1;padding:12px;border:1.5px solid var(--celadon-mist);border-radius:10px;font-size:14px;font-family:var(--font)}
.fitness-record{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow);font-size:13px}
.fitness-record .fr-text{flex:1}
.fitness-record .fr-source{font-size:11px;color:var(--text-hint);margin-left:8px}
.fitness-record .fr-del{color:var(--text-hint);cursor:pointer;font-size:16px;padding:4px 8px}
.duo-display{font-size:36px;font-weight:600;color:var(--celadon-deep);text-align:center;padding:20px}
.duo-edit-wrap{display:none;margin-top:12px}
.duo-edit-wrap.show{display:block}
.duo-edit-wrap input{width:80px;padding:8px;border:1.5px solid var(--celadon-mist);border-radius:10px;font-size:16px;font-family:var(--font);text-align:center}

/* Edit Copywrite Page */
.edit-copy-wrap{padding:16px 0}
.edit-copy-wrap textarea{width:100%;min-height:200px;padding:14px;border:1.5px solid var(--celadon-mist);border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);line-height:1.6;outline:none;resize:vertical}
.edit-copy-wrap textarea:focus{border-color:var(--celadon)}
.edit-copy-btns{display:flex;gap:10px;margin-top:12px}

/* Sub page header */
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sub-back{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--celadon-mist);background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sub-title{font-size:17px;font-weight:600;color:var(--celadon-deep)}

/* Add book / project form */
.add-form{display:flex;gap:10px;margin-bottom:16px}
.add-form input,.add-form select{padding:10px 12px;border:1.5px solid var(--celadon-mist);border-radius:10px;font-size:13px;font-family:var(--font)}
.add-form input{flex:1}
</style>
</head>
<body>

<button class="layout-toggle" onclick="toggleLayout()">切换布局</button>

<!-- Sidebar Layout -->
<div class="sidebar-layout" id="sidebarLayout">
  <aside class="sidebar">
    <div class="sidebar-brand">一秋的工作台<small id="sideDate"></small></div>
    <nav class="sidebar-nav">
      <div class="sidebar-item active" onclick="sideNav('home',this)"><span class="si-icon"></span>主页</div>
      <div class="sidebar-item" onclick="sideNav('todo',this)"><span class="si-icon"></span>待办</div>
      <div class="sidebar-item" onclick="sideNav('create',this)"><span class="si-icon"></span>创作</div>
      <div class="sidebar-item" onclick="sideNav('growth',this)"><span class="si-icon">📚</span>成长</div>
    </nav>
  </aside>
  <div class="sidebar-content" id="sidebarContent"></div>
</div>

<!-- Bottom Layout -->
<div class="bottom-layout active-layout" id="bottomLayout">
  <div class="bottom-header">
    <div class="header-date" id="todayDate"></div>
    <div class="header-title">一秋的工作台</div>
    <div class="header-quote" id="todayQuote"></div>
  </div>
  <div class="bottom-content" id="bottomContent"></div>
  <nav class="bottom-nav">
    <button class="bnav-item active" onclick="bottomNav('home',this)"><span class="bnav-icon">🏠</span><span class="bnav-label">主页</span></button>
    <button class="bnav-item" onclick="bottomNav('todo',this)"><span class="bnav-icon">📋</span><span class="bnav-label">待办</span></button>
    <button class="bnav-item" onclick="bottomNav('create',this)"><span class="bnav-icon">🎬</span><span class="bnav-label">创作</span></button>
    <button class="bnav-item" onclick="bottomNav('growth',this)"><span class="bnav-icon">📚</span><span class="bnav-label">成长</span></button>
  </nav>
</div>

<script>
// ===== App Version Auto-Refresh =====
var APP_VERSION='3.1.0';
(function(){
  var saved=localStorage.getItem('yiqiu_app_ver');
  if(saved&&saved!==APP_VERSION){localStorage.setItem('yiqiu_app_ver',APP_VERSION);location.reload(true);}
  else if(!saved){localStorage.setItem('yiqiu_app_ver',APP_VERSION);}
})();

// ===== Data Store =====
var store={
  get:function(k,d){try{return JSON.parse(localStorage.getItem('yiqiu_'+k))||d}catch(e){return d}},
  set:function(k,v){localStorage.setItem('yiqiu_'+k,JSON.stringify(v))}
};

// ===== Date & Quote =====
var now=new Date(),days=['日','一','二','三','四','五','六'];
var dateStr=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · 星期'+days[now.getDay()];
document.getElementById('todayDate').textContent=dateStr;
document.getElementById('sideDate').textContent=dateStr;
var quotes=['雨过天青云破处','今天想创造点什么？','慢慢来，比较快','做就是了','允许一切发生','世界是我的牡蛎'];
document.getElementById('todayQuote').textContent=quotes[now.getDate()%quotes.length];

// ===== Layout =====
var currentLayout='bottom',currentSubPage='main',editingCopyIndex=-1;
function toggleLayout(){
  var bl=document.getElementById('bottomLayout'),sl=document.getElementById('sidebarLayout');
  if(currentLayout==='bottom'){bl.classList.remove('active-layout');sl.classList.add('active-layout');currentLayout='sidebar';renderSidebar();}
  else{sl.classList.remove('active-layout');bl.classList.add('active-layout');currentLayout='bottom';renderBottomContent('home');}
}
function renderSidebar(){
  var c=document.getElementById('sidebarContent');
  var active=document.querySelector('.sidebar-item.active');
  var page=active?active.textContent.trim().replace(/^[^\s]+\s/,''):'';
  var map={'主页':'home','待办':'todo','创作':'create','成长':'growth'};
  c.innerHTML=renderPage(map[page]||'home');
}
function sideNav(page,el){
  document.querySelectorAll('.sidebar-item').forEach(function(n){n.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('sidebarContent').innerHTML=renderPage(page);
}
function bottomNav(page,el){
  document.querySelectorAll('.bnav-item').forEach(function(n){n.classList.remove('active')});
  el.classList.add('active');
  if(page==='home'){renderBottomContent('home');return;}
  if(page==='create'){currentSubPage='main';renderBottomContent('create');return;}
  renderBottomContent(page);
}
function navTo(page,sub){
  if(page==='create'&&sub)currentSubPage=sub;
  else if(page==='create')currentSubPage='main';
  document.querySelectorAll('.bnav-item').forEach(function(n){n.classList.remove('active')});
  var idx={home:0,todo:1,create:2,growth:3}[page];
  if(idx!==undefined)document.querySelectorAll('.bnav-item')[idx].classList.add('active');
  renderBottomContent(page==='create'?'create':page);
}
function enterSubPage(sub){currentSubPage=sub;renderCurrentPage();}
function renderCurrentPage(){
  if(currentLayout==='sidebar')renderSidebar();
  else{var p=document.querySelector('.bnav-item.active');if(p)p.click();}
}
function renderPage(page){
  if(page==='home')return homePage();
  if(page==='todo')return todoPage();
  if(page==='create')return createPage(currentSubPage);
  if(page==='growth')return growthPage();
  return homePage();
}
function renderBottomContent(page){
  var c=document.getElementById('bottomContent');
  if(page==='home')c.innerHTML=homePage();
  else if(page==='todo')c.innerHTML=todoPage();
  else if(page==='create')c.innerHTML=createPage(currentSubPage);
  else if(page==='growth')c.innerHTML=growthPage();
}

// ===== Home Page =====
function homePage(){
  var todos=store.get('todos',[]),pending=todos.filter(function(t){return t.status==='pending'}).length;
  var done=todos.filter(function(t){return t.status==='done'}).length;
  var notes=store.get('notes',[]),copies=store.get('copies',[]),projects=store.get('projects',[]);
  var books=store.get('books',[]),duolingo=store.get('duolingo',{streak:15});
  var fitKw=['运动','健身','锻炼','跑步','游泳','攀岩','骑行','瑜伽','跳绳','球','爬楼','走路','拉伸'];
  var fitnessLogs=store.get('fitnessLogs',[]);
  var now2=new Date(),ws=new Date(now2);ws.setDate(now2.getDate()-now2.getDay()+1);ws.setHours(0,0,0,0);
  var weekFit=todos.filter(function(t){return t.status==='done'&&fitKw.some(function(k){return t.text.indexOf(k)>=0})&&new Date(t.created)>=ws}).length+fitnessLogs.filter(function(l){return new Date(l.time)>=ws}).length;
  var reading=books.find(function(b){return b.progress<100});
  var h=now2.getHours(),greet=h<6?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好';
  var html='<div class="home-greeting"><div class="home-greeting-text">'+greet+'，一秋 ️</div><div class="home-greeting-sub">'+dateStr+'</div></div>';
  html+='<div class="home-tiles">';
  html+='<div class="tile tile-lg" onclick="navTo(\'todo\')"><div class="tile-accent"></div><div class="tile-icon"></div><div class="tile-title">待办事项</div><div style="display:flex;gap:16px;margin-top:10px"><div><span style="font-size:24px;font-weight:600;color:var(--celadon-deep)">'+pending+'</span><span style="font-size:12px;color:var(--text-sec);margin-left:4px">待完成</span></div><div><span style="font-size:24px;font-weight:600;color:#2E7D32">'+done+'</span><span style="font-size:12px;color:var(--text-sec);margin-left:4px">已完成</span></div></div></div>';
  html+='<div class="tile" onclick="navTo(\'create\',\'inspire\')"><div class="tile-accent"></div><div class="tile-icon">💡</div><div class="tile-title">灵感</div><div class="tile-sub">'+(notes.length>0?notes.length+'条随笔':'记录第一条灵感')+'</div></div>';
  html+='<div class="tile" onclick="navTo(\'create\',\'copywrite\')"><div class="tile-accent"></div><div class="tile-icon">📝</div><div class="tile-title">文案</div><div class="tile-sub">'+(copies.length>0?copies.length+'篇文案':'开始整理文案')+'</div></div>';
  html+='<div class="tile" onclick="navTo(\'create\',\'video\')"><div class="tile-accent"></div><div class="tile-icon"></div><div class="tile-title">视频项目</div><div class="tile-sub">'+(projects.length>0?projects.length+'个项目':'创建第一个项目')+'</div></div>';

// ===== Todo Page =====
function todoPage(){
  var allTodos=store.get('todos',[]),todos=allTodos.filter(function(t){return !t.cleared});
  var done=todos.filter(function(t){return t.status==='done'}).length;
  var failed=todos.filter(function(t){return t.status==='fail'}).length;
  var pending=todos.filter(function(t){return t.status==='pending'}).length;
  var total=todos.length,rate=total>0?Math.round(done/total*100):0;

  // Weekly & Monthly stats
  var now2=new Date(),dow=now2.getDay()||7;
  var weekStart=new Date(now2);weekStart.setDate(now2.getDate()-dow+1);weekStart.setHours(0,0,0,0);
  var monthStart=new Date(now2.getFullYear(),now2.getMonth(),1);
  var weekDone=allTodos.filter(function(t){return t.status==='done'&&!t.cleared&&new Date(t.created)>=weekStart}).length;
  var weekFail=allTodos.filter(function(t){return t.status==='fail'&&!t.cleared&&new Date(t.created)>=weekStart}).length;
  var monthDone=allTodos.filter(function(t){return t.status==='done'&&!t.cleared&&new Date(t.created)>=monthStart}).length;
  var monthFail=allTodos.filter(function(t){return t.status==='fail'&&!t.cleared&&new Date(t.created)>=monthStart}).length;

  var html='<div class="todo-input-wrap"><textarea class="todo-input" id="todoInput" placeholder="输入待办，每行一条…"></textarea><button class="todo-add-btn" onclick="addTodo()">添加</button></div>';
  html+='<div class="todo-stats"><div>待完成 <span>'+pending+'</span></div><div>已完成 <span>'+done+'</span></div><div>未完成 <span>'+failed+'</span></div><div>完成率 <span>'+rate+'%</span></div></div>';

  todos.forEach(function(t,i){
    var realIdx=allTodos.indexOf(t);
    html+='<div class="todo-item'+(t.status==='done'?' done':'')+(t.status==='fail'?' fail':'')+'">';
    html+='<div class="todo-text">'+escHtml(t.text)+'</div>';
    html+='<div class="todo-btns">';
    html+='<button class="todo-btn check" onclick="markTodo('+realIdx+',\'done\')" title="完成">✓</button>';
    html+='<button class="todo-btn cross" onclick="markTodo('+realIdx+',\'fail\')" title="没做">✗</button>';
    html+='<button class="todo-btn" onclick="archiveTodo('+realIdx+')" title="删除" style="font-size:14px;color:var(--text-hint)">✕</button>';
    html+='</div></div>';
  });

  html+='<button class="todo-clear-btn" onclick="clearDoneTodos()">清除所有已完成</button>';

  // History with weekly/monthly stats
  html+='<div class="history-section"><div class="history-title">📊 历史统计</div>';
  html+='<div class="history-week-stats">';
  html+='<div class="stat-box"><div class="stat-num">'+weekDone+'</div><div class="stat-label">本周完成</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+weekFail+'</div><div class="stat-label">本周未完成</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+monthDone+'</div><div class="stat-label">本月完成</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+monthFail+'</div><div class="stat-label">本月未完成</div></div>';
  html+='</div>';

  var byDate={};
  allTodos.forEach(function(t){var d=t.created||'未知';if(!byDate[d])byDate[d]={total:0,done:0,fail:0,pending:0};byDate[d].total++;if(t.status==='done')byDate[d].done++;else if(t.status==='fail')byDate[d].fail++;else byDate[d].pending++;});
  var dates=Object.keys(byDate).sort(function(a,b){return new Date(b)-new Date(a)});
  dates.forEach(function(d){
    var s=byDate[d];
    html+='<div class="history-date" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')">'+d+'（'+s.total+'条 · 完成'+s.done+' · 未完成'+s.fail+'）</div>';
    html+='<div class="history-detail">';
    allTodos.forEach(function(t,idx){
      if(t.created===d){
        html+='<div class="history-item"><span style="flex:1;font-size:13px">'+escHtml(t.text)+'</span>';
        html+='<span class="h-status '+t.status+'">'+(t.status==='done'?'完成':t.status==='fail'?'未完成':'待办')+'</span>';
        html+='<span class="history-item .fr-del" onclick="deleteHistoryItem('+idx+')" style="color:var(--text-hint);cursor:pointer;margin-left:8px;font-size:14px"></span>';
        html+='</div>';
      }
    });
    html+='</div>';
  });
  html+='</div>';
  return html;
}

// ===== Todo Actions =====
function addTodo(){
  var el=document.getElementById('todoInput');if(!el||!el.value.trim())return;
  var lines=el.value.trim().split('\n').filter(function(l){return l.trim()});
  var todos=store.get('todos',[]),today=new Date().toLocaleDateString();
  lines.forEach(function(line){todos.push({text:line.trim(),status:'pending',created:today})});
  store.set('todos',todos);el.value='';renderCurrentPage();
}
function markTodo(idx,status){
  var todos=store.get('todos',[]);if(!todos[idx])return;
  todos[idx].status=status;store.set('todos',todos);renderCurrentPage();
}
function archiveTodo(idx){
  var todos=store.get('todos',[]);if(!todos[idx])return;
  todos[idx].cleared=true;store.set('todos',todos);renderCurrentPage();
}
function clearDoneTodos(){
  if(!confirm('确定清除所有已完成/未完成的待办？\n它们会从待办列表消失，但历史记录和健身统计会保留。'))return;
  var todos=store.get('todos',[]);
  todos=todos.map(function(t){if(t.status==='done'||t.status==='fail'){t.cleared=true}return t});
  store.set('todos',todos);renderCurrentPage();
}
function deleteHistoryItem(idx){
  var todos=store.get('todos',[]);todos.splice(idx,1);store.set('todos',todos);renderCurrentPage();
}

// ===== Note Actions =====
function addNote(){
  var el=document.getElementById('noteInput');if(!el||!el.value.trim())return;
  var notes=store.get('notes',[]);notes.unshift({text:el.value.trim(),time:new Date().toLocaleString()});
  store.set('notes',notes);renderCurrentPage();
}
function deleteNote(i){var notes=store.get('notes',[]);notes.splice(i,1);store.set('notes',notes);renderCurrentPage()}
function moveToCopywrite(i){
  var notes=store.get('notes',[]),copies=store.get('copies',[]);
  copies.unshift({text:notes[i].text,time:notes[i].time});
  store.set('copies',copies);notes.splice(i,1);store.set('notes',notes);
  currentSubPage='copywrite';renderCurrentPage();
}

// ===== Copywrite Actions =====
function editCopywrite(i){editingCopyIndex=i;enterSubPage('edit')}
function saveEditCopy(){
  var el=document.getElementById('editCopyText');if(!el)return;
  var copies=store.get('copies',[]);
  if(editingCopyIndex>=0&&copies[editingCopyIndex]){copies[editingCopyIndex].text=el.value.trim()}
  else{copies.unshift({text:el.value.trim(),time:new Date().toLocaleString()})}
  store.set('copies',copies);editingCopyIndex=-1;enterSubPage('copywrite');
}
function deleteCopywrite(i){var copies=store.get('copies',[]);copies.splice(i,1);store.set('copies',copies);renderCurrentPage()}

// ===== Project Actions =====
function addProject(){
  var el=document.getElementById('projInput');if(!el||!el.value.trim())return;
  var projects=store.get('projects',[]);
  projects.push({title:el.value.trim(),status:document.getElementById('projStatus').value,time:new Date().toLocaleString()});

function updateProjStatus(i,v){var projects=store.get('projects',[]);projects[i].status=v;store.set('projects',projects);renderCurrentPage()}
function deleteProject(i){var projects=store.get('projects',[]);projects.splice(i,1);store.set('projects',projects);renderCurrentPage()}

// ===== Growth Actions =====
function addBook(){
  var t=document.getElementById('bookTitle'),p=document.getElementById('bookPages');
  if(!t||!t.value.trim())return;
  var books=store.get('books',[]),pages=parseInt(p.value)||100;
  books.push({title:t.value.trim(),progress:0,pages:pages,currentPage:0});
  store.set('books',books);renderCurrentPage();
}
function updateBookProgress(i){
  var books=store.get('books',[]);
  var curEl=document.getElementById('bookCur'+i),totalEl=document.getElementById('bookTotal'+i);
  var cur=parseInt(curEl.value)||0,total=parseInt(totalEl.value)||1;
  books[i].currentPage=cur;books[i].pages=total;
  books[i].progress=Math.min(100,Math.round(cur/total*100));
  store.set('books',books);renderCurrentPage();
}
function deleteBook(i){var books=store.get('books',[]);books.splice(i,1);store.set('books',books);renderCurrentPage()}
function toggleDuoEdit(){var w=document.getElementById('duoEditWrap');w.classList.toggle('show')}
function saveDuolingo(){var v=parseInt(document.getElementById('duoStreakInput').value)||0;store.set('duolingo',{streak:v});renderCurrentPage()}
function saveFitnessLog(){
  var el=document.getElementById('fitnessInput');if(!el||!el.value.trim())return;
  var logs=store.get('fitnessLogs',[]);logs.unshift({text:el.value.trim(),time:new Date().toLocaleString()});
  store.set('fitnessLogs',logs);renderCurrentPage();
}
function deleteFitnessRecord(type,idx){
  if(type==='log'){var logs=store.get('fitnessLogs',[]);logs.splice(idx,1);store.set('fitnessLogs',logs)}
  else if(type==='todo'){var hidden=store.get('hiddenFitTodos',[]);if(!hidden.includes(idx))hidden.push(idx);store.set('hiddenFitTodos',hidden)}
  renderCurrentPage();
}

// ===== Copy & Share =====
function copyText(text){
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板')}).catch(function(){fallbackCopy(text)})}
  else{fallbackCopy(text)}
}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('已复制到剪贴板')}catch(e){prompt('请手动复制：',text)}document.body.removeChild(ta)}
function shareText(text){if(navigator.share){navigator.share({title:'一秋的工作台',text:text}).catch(function(){})}else{copyText(text);alert('已复制，可以粘贴到备忘录了')}}
function shareToNotes(i){var notes=store.get('notes',[]);if(notes[i])shareText(notes[i].text)}
function shareCopy(i){var copies=store.get('copies',[]);if(copies[i])shareText(copies[i].text)}

// ===== Data Backup / Restore =====
var DATA_KEYS=['todos','notes','copies','projects','books','duolingo','fitnessLogs','hiddenFitTodos'];
function exportData(){
  var data={};DATA_KEYS.forEach(function(k){data[k]=store.get(k,null)});
  var json=JSON.stringify(data),encoded=btoa(unescape(encodeURIComponent(json)));
  var ta=document.createElement('textarea');ta.value=encoded;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('✅ 备份码已复制！请粘贴保存到备忘录。')}catch(e){prompt('请复制下面的备份码：',encoded)}
  document.body.removeChild(ta);
}
function importData(){
  var code=prompt('请粘贴备份码：');if(!code||!code.trim())return;
  try{
    var json=decodeURIComponent(escape(atob(code.trim()))),data=JSON.parse(json),count=0;
    for(var k in data){if(data[k]!==null&&data[k]!==undefined){store.set(k,data[k]);count++}}
    alert('✅ 恢复了 '+count+' 项数据！');renderCurrentPage();
  }catch(e){alert('❌ 备份码无效，请检查后重试。')}
}

// ===== Helpers =====
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escAttr(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,'\\n')}

// ===== Initial Render =====
renderBottomContent('home');
</script>
</body>
</html>
